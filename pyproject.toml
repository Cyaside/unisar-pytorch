[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unisar-pytorch"
version = "0.1.0"
description = "Independent UniSAR architecture implementation and temporal KuaiSAR training workflow"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.24", "torch>=2.3", "pyarrow>=16", "duckdb>=1.2", "scikit-learn>=1.4", "PyYAML>=6", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat>=5"]

[tool.setuptools.packages.find]
include = ["unisar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".local/pytest-cache"

